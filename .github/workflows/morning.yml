name: Morning risk report

on:
  schedule:
    # 05:00 UTC on weekdays, 06:00 or 07:00 in Frankfurt, after the previous Xetra close
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Morning report
        run: |
          python -m riskmon.cli monitor --verbose
          cat "$(ls -t reports/*.md | head -1)" >> "$GITHUB_STEP_SUMMARY"

      - run: python -m riskmon.cli backtest

      - run: python -m riskmon.cli dashboard

      - name: Publish dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "dashboard unchanged, nothing to publish"
          else
            git commit -m "Refresh dashboard"
            git push
          fi
